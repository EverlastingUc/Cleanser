name: Package Cleanser release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Release tag must match package.json
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF_NAME#v}"
          if [ "$expected" != "$actual" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package.json version '$expected'." >&2
            exit 1
          fi
      - run: npm install
      - run: npm test
      - run: npm run vscode:package
      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" *.vsix --clobber
